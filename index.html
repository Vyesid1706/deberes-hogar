<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1714">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Deberes del Hogar</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#f4f7f5; --card:#ffffff; --ink:#0d1a15; --mute:#6a7c75;
  --brand:#17795c; --brand-2:#26a37c; --brand-ink:#ffffff;
  --line:rgba(13,26,21,.09); --line-2:rgba(13,26,21,.055);
  --ok:#12855a; --bad:#c0392b; --warn:#b7791f;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 12px 30px -20px rgba(16,24,40,.4);
  --r:20px; --nav-h:70px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0a100e; --card:#131c18; --ink:#e9f0ec; --mute:#8ea29a;
    --brand:#2aa87c; --brand-2:#35c493; --brand-ink:#03110b;
    --line:rgba(255,255,255,.085); --line-2:rgba(255,255,255,.05);
    --ok:#3ecf8e; --bad:#ff7a6b; --warn:#e0b155;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 34px -22px rgba(0,0,0,.95);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Plus Jakarta Sans",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;letter-spacing:-.005em;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 26px);
  -webkit-font-smoothing:antialiased}

.i{display:inline-flex;flex:none;width:20px;height:20px}
.i svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.i.sm{width:16px;height:16px}
.i.lg{width:26px;height:26px}
.i.xl{width:40px;height:40px;stroke-width:1.4}
.i.xl svg{stroke-width:1.4}

.appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:calc(9px + env(safe-area-inset-top)) 18px 9px;
  background:color-mix(in srgb,var(--bg) 80%, transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line-2)}
.appbar img{width:34px;height:34px;image-rendering:pixelated;flex:none;object-fit:contain}
.appbar h1{margin:0;font-size:16px;font-weight:800;letter-spacing:-.02em}
.pill{font-size:11.5px;font-weight:700;padding:7px 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--mute);white-space:nowrap;letter-spacing:0}
.pill.on{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 34%, transparent)}
.pill.busy{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 34%, transparent)}

main{padding:16px 16px 6px;max-width:560px;margin:0 auto}
@media (min-width:900px){
  body{display:flex;justify-content:center}
  .appbar{position:fixed;left:0;right:0}
  main{padding-top:74px;max-width:600px}
}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:16px;margin-bottom:12px}
.card.flat{box-shadow:none}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.title{font-weight:700;letter-spacing:-.015em}
.sub{font-size:13px;color:var(--mute);line-height:1.35}
.h2{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:24px 6px 10px}
.mono{font-variant-numeric:tabular-nums}

button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;padding:0}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  padding:14px 16px;border-radius:15px;font-weight:700;font-size:15px;letter-spacing:-.01em;
  background:linear-gradient(160deg,var(--brand),var(--brand-2));color:var(--brand-ink);
  box-shadow:0 10px 24px -16px var(--brand)}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.soft{background:color-mix(in srgb,var(--brand) 11%, transparent);color:var(--brand);box-shadow:none}
.btn.danger{background:none;border:1px solid color-mix(in srgb,var(--bad) 40%, transparent);color:var(--bad);box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{padding:10px 14px;font-size:13.5px;width:auto;border-radius:12px}
.btn-row{display:flex;gap:10px}
.btn-row>.btn{flex:1}
.icon-btn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card)}
.icon-btn:active{background:var(--line-2)}

label.lbl{font-size:12.5px;color:var(--mute);font-weight:700;display:block;margin:14px 2px 7px}
input[type=text],input[type=email],input[type=time],input[type=number],select{
  width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--card) 90%, var(--bg));color:var(--ink);font:inherit;outline:none;font-weight:500}
input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 15%, transparent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:.2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:.2s}
.sw input:checked + i{background:var(--brand)}
.sw input:checked + i::after{transform:translateX(18px)}

.weekbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.wk{text-align:center}
.wk .t{font-weight:800;font-size:15px;letter-spacing:-.02em}
.wk .d{font-size:12.5px;color:var(--mute)}
.progress{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.progress span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}

.chore{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card);
  border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);margin-bottom:10px}
.chore .nm{font-weight:700;font-size:15px;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chore .mt{font-size:12.5px;color:var(--mute);margin-top:1px}
.chore.done .nm{text-decoration:line-through;color:var(--mute);font-weight:600}
.chk{width:34px;height:34px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.chk svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.chore.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.who{display:flex;align-items:center;gap:7px;padding:6px 11px 6px 6px;border-radius:999px;
  background:color-mix(in srgb,var(--av,var(--brand)) 13%, transparent);
  border:1px solid color-mix(in srgb,var(--av,var(--brand)) 26%, transparent)}
.who b{font-size:12.5px;font-weight:700;color:var(--av,var(--brand));max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;background:var(--av,var(--brand));flex:none;letter-spacing:0}
.av.lg{width:38px;height:38px;font-size:13px}
.av.xl{width:52px;height:52px;font-size:17px}

.empty{text-align:center;padding:36px 20px;color:var(--mute);font-size:14px}
.empty .ico{width:56px;height:56px;margin:0 auto 14px;color:color-mix(in srgb,var(--mute) 55%, transparent)}
.month-ico{width:46px;height:46px;flex:none;border-radius:15px;display:grid;place-items:center;
  color:var(--brand);background:color-mix(in srgb,var(--brand) 12%, transparent)}

.item{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line-2)}
.item:last-child{border-bottom:0}
.item .t{font-weight:700;font-size:14.5px}
.item .s{font-size:12.5px;color:var(--mute)}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px;
  background:color-mix(in srgb,var(--brand) 13%, transparent);color:var(--brand)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;white-space:nowrap;color:var(--mute)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.wheel-wrap{position:relative;width:100%;max-width:300px;margin:6px auto 0;aspect-ratio:1}
.wheel{width:100%;height:100%;transform-origin:50% 50%;transition:transform 3.6s cubic-bezier(.12,.72,.12,1)}
.wheel-pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid var(--ink);z-index:2;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.wheel-hub{position:absolute;inset:38%;border-radius:50%;background:var(--card);border:2px solid var(--line);
  display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--mute)}
.result{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;margin-top:14px;
  background:color-mix(in srgb,var(--av) 12%, transparent);border:1px solid color-mix(in srgb,var(--av) 25%, transparent)}

.avatar-chip{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);
  border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);margin-bottom:10px}
.avatar-chip .del{margin-left:auto;color:var(--bad);padding:8px}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--card) 90%, transparent);border-top:1px solid var(--line-2);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:14px;
  font-size:10.5px;font-weight:700;color:var(--mute);letter-spacing:0}
nav button .i{width:22px;height:22px}
nav button.on{color:var(--brand)}
nav button.on .i{transform:translateY(-1px)}
@media (min-width:900px){
  nav{left:50%;right:auto;transform:translateX(-50%);bottom:20px;width:440px;border:1px solid var(--line);
    border-radius:22px;box-shadow:var(--shadow);padding:8px}
}

#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 18px);
  background:#0d1a15;color:#fff;padding:14px 16px;border-radius:15px;font-size:14px;font-weight:500;display:none;z-index:90;
  box-shadow:0 20px 44px -22px rgba(0,0,0,.7);max-width:460px;margin:0 auto}
#sheet,#report{position:fixed;inset:0;z-index:80;display:none}
#sheet.open,#report.open{display:block}
.back{position:absolute;inset:0;background:rgba(5,10,8,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;
  padding:10px 14px calc(20px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;
  animation:up .24s cubic-bezier(.2,.8,.3,1);max-height:82vh;overflow:auto}
@keyframes up{from{transform:translateY(22px);opacity:.5}to{transform:none;opacity:1}}
.handle{width:42px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:0 6px 10px;font-size:17px;font-weight:800;letter-spacing:-.02em}
.sheet-item{display:flex;align-items:center;gap:12px;width:100%;padding:14px 12px;border-radius:14px;font-size:15px;font-weight:600;text-align:left}
.sheet-item:active{background:var(--line-2)}
.sheet-item.sel{background:color-mix(in srgb,var(--brand) 10%, transparent);color:var(--brand)}
.sheet-item.cancel{color:var(--mute);justify-content:center;margin-top:6px}
.tick{margin-left:auto;color:var(--brand)}

#report .panel{position:absolute;inset:0;background:var(--bg);overflow:auto;
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
#report img{width:100%;border-radius:18px;display:block;box-shadow:var(--shadow);margin-bottom:12px}
.report-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.report-head h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
</style>
</head>
<body>

<header class="appbar">
  <img src="heart.svg" alt="">
  <div class="grow"><h1>Deberes del Hogar</h1></div>
  <button class="pill" id="status" data-a="tab" data-t="ajustes">—</button>
</header>

<main id="main"></main>
<div id="toast"></div>
<div id="sheet"></div>
<div id="report"></div>
<nav id="nav"></nav>

<script>
'use strict';
/* =======================================================================
   El calendario compartido "Deberes del hogar" es la base de datos.
   ======================================================================= */

const DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DAYS_S=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const COLORS=['#e07856','#5b8def','#b07cd6','#3fa98a','#d9a441','#e06a9b','#4bb3c9','#8aa54b'];
const KEY='deberes-hogar-v2';
const SCOPE='openid email https://www.googleapis.com/auth/calendar';
const TZ=Intl.DateTimeFormat().resolvedOptions().timeZone;
const PREFIX='DH2:';
const CLIENT_ID_DEFAULT='872298332090-mudshrohbis3191obef4fss2s9h4r4rh.apps.googleusercontent.com';
const DEFAULT_CHORES=['Lavar los platos','Sacar la basura','Barrer y trapear','Limpiar el baño','Cocinar','Lavar la ropa','Ordenar la sala','Regar las plantas'];

const I={
  check:'<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>',
  left:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="3.5"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
  list:'<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4" cy="6" r="1.5"/><circle cx="4" cy="12" r="1.5"/><circle cx="4" cy="18" r="1.5"/></svg>',
  wheel:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.2 6.2M12 12L5.8 18.2M12 12l8.4-2.2M12 12L3.6 9.8"/></svg>',
  users:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.3"/><path d="M3.6 20c0-3 2.4-5 5.4-5s5.4 2 5.4 5"/><path d="M16 5.4a3 3 0 0 1 0 5.4M17.6 14.7c2 .6 3.4 2.3 3.4 4.6"/></svg>',
  sliders:'<svg viewBox="0 0 24 24"><path d="M4 7h7M17 7h3M4 17h3M13 17h7"/><circle cx="14" cy="7" r="2.6"/><circle cx="9" cy="17" r="2.6"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>',
  refresh:'<svg viewBox="0 0 24 24"><path d="M20.5 11a8.5 8.5 0 1 0-2.6 6.4"/><path d="M20.5 5v6h-6"/></svg>',
  share:'<svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 13v6.5A2.5 2.5 0 0 0 7.5 22h9A2.5 2.5 0 0 0 19 19.5V13"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.8h5V7M6.5 7l.9 12.5h9.2L17.5 7"/></svg>',
  link:'<svg viewBox="0 0 24 24"><path d="M10.5 13.5a4 4 0 0 0 5.6 0l2-2a4 4 0 0 0-5.6-5.6l-1.4 1.4"/><path d="M13.5 10.5a4 4 0 0 0-5.6 0l-2 2a4 4 0 0 0 5.6 5.6l1.4-1.4"/></svg>',
  play:'<svg viewBox="0 0 24 24"><path d="M7 4.8l12.5 7.2L7 19.2z"/></svg>',
  image:'<svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="3.5"/><circle cx="8.6" cy="9.8" r="1.6"/><path d="M20.5 16l-4.8-4.8L9 18"/></svg>',
  close:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  key:'<svg viewBox="0 0 24 24"><circle cx="8" cy="12" r="4.2"/><path d="M12.2 12H21M17 12v3.2M20 12v2.4"/></svg>',
  user:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.2"/><path d="M4.5 20.5c0-3.6 3.4-6 7.5-6s7.5 2.4 7.5 6"/></svg>',
  home:'<svg viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>',
  alert:'<svg viewBox="0 0 24 24"><path d="M12 4.5l8.6 15.2H3.4z"/><path d="M12 10v4.2M12 17.4v.4"/></svg>'
};

let S=load();
let tok=null, tokExp=0, busy=false, tab='semana', wOff=0;
let VIEW=[], EVMAP={}, CALPICK=[], CONNECTED=false;
let dirty=false, saving=false, saveTimer=null;
let sundaySig='';
let wheelChore=null, wheelRot=0, spinning=false, wheelResult=null;
let pendingMonth=null;
let REPORT=null;

function load(){
  let s={};
  try{ s=JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){}
  const base={
    clientId:CLIENT_ID_DEFAULT, calendarId:'', calendarName:'', account:'',
    members:[], overrides:{}, weeks:4, sunday:{on:true,time:'20:00'}, archive:[], skipMonth:'',
    chores:DEFAULT_CHORES.map((n,i)=>({id:'c'+i,name:n,active:false,day:i%7,time:'18:00'}))
  };
  const st=Object.assign(base,s);
  if(!st.clientId) st.clientId=CLIENT_ID_DEFAULT;
  if(!st.since) st.since=iso(new Date());
  st.sunday=Object.assign({on:true,time:'20:00'}, s.sunday||{});
  if(!Array.isArray(st.archive)) st.archive=[];
  return st;
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();

/* ---------- fechas ---------- */
function monday(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseISO(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function weekIndex(m){return Math.round((m-new Date(2024,0,1))/(7*864e5));}
function dateAt(d,time){const [h,m]=String(time||'18:00').split(':').map(Number);const x=new Date(d);x.setHours(h||0,m||0,0,0);return x;}
const fmtShort=d=>d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3);
const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
function lastSundayOf(y,m){const d=new Date(y,m+1,0);d.setDate(d.getDate()-d.getDay());d.setHours(23,59,0,0);return d;}

/* ---------- rotación ---------- */
function assignments(mon){
  const act=S.chores.filter(c=>c.active), n=S.members.length;
  if(!n) return [];
  const w=weekIndex(mon);
  return act.map((c,j)=>{
    const key=iso(mon)+'|'+c.id;
    const ov=S.members.find(m=>m.id===S.overrides[key]);
    const member=ov||S.members[((j+w)%n+n)%n];
    return {key,chore:c,member,date:addDays(mon,c.day)};
  }).sort((a,b)=>a.date-b.date||a.chore.time.localeCompare(b.chore.time));
}
const colorOf=m=>COLORS[Math.max(0,S.members.findIndex(x=>x.id===m.id))%COLORS.length];

/* ---------- Google ---------- */
function auth(){
  return new Promise((res,rej)=>{
    if(!S.clientId) return rej(new Error('Falta el Client ID de Google.'));
    if(tok&&Date.now()<tokExp) return res();
    if(!window.google||!google.accounts) return rej(new Error('No se pudo cargar Google. Revisa la conexión.'));
    const tc=google.accounts.oauth2.initTokenClient({
      client_id:S.clientId, scope:SCOPE,
      callback:r=>{ if(r.error) return rej(new Error(r.error)); tok=r.access_token; tokExp=Date.now()+(Number(r.expires_in||3600)-60)*1000; res(); },
      error_callback:e=>{
        const t=(e&&(e.type||e.message))||'';
        if(/popup/i.test(t)) return rej(new Error('El navegador bloqueó la ventana de Google. Abre la app en Chrome y reintenta.'));
        rej(new Error(t||'Autorización cancelada'));
      }
    });
    tc.requestAccessToken();
  });
}
async function api(path,opt={}){
  const r=await fetch('https://www.googleapis.com/calendar/v3'+path,{...opt,headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'}});
  if(r.status===401){ tok=null; tokExp=0; const e=new Error('La sesión de Google caducó. Toca «Conectar con Google».'); e.status=401; throw e; }
  if(!r.ok){ let m='Error '+r.status; try{ m=(await r.json()).error.message; }catch(e){} const err=new Error(m); err.status=r.status; throw err; }
  return r.status===204?null:r.json();
}
const enc=encodeURIComponent;
async function pool(items,limit,fn){
  const arr=items.slice();
  await Promise.all(Array.from({length:Math.min(limit,arr.length)},async()=>{
    while(arr.length){ await fn(arr.shift()); }
  }));
}

/* ---------- config ---------- */
function packCfg(){
  return {m:S.members.map(x=>[x.id,x.name,x.email||'']),
          c:S.chores.map(x=>[x.id,x.name,x.active?1:0,x.day,x.time]),
          o:S.overrides, w:S.weeks, s:[S.sunday.on?1:0,S.sunday.time],
          a:S.archive.slice(-12)};
}
function applyCfg(o){
  if(!o) return;
  if(Array.isArray(o.m)) S.members=o.m.map(a=>({id:a[0],name:a[1],email:a[2]||''}));
  if(Array.isArray(o.c)) S.chores=o.c.map(a=>({id:a[0],name:a[1],active:!!a[2],day:a[3]|0,time:a[4]||'18:00'}));
  if(o.o&&typeof o.o==='object') S.overrides=o.o;
  if(o.w) S.weeks=o.w;
  if(Array.isArray(o.s)) S.sunday={on:!!o.s[0],time:o.s[1]||'20:00'};
  if(Array.isArray(o.a)) S.archive=o.a;
  save();
}
async function pullCfg(){
  const cal=await api('/calendars/'+enc(S.calendarId));
  S.calendarName=cal.summary||'';
  const d=String(cal.description||'');
  const at=d.startsWith(PREFIX)?PREFIX.length:(d.startsWith('DH1:')?4:-1);
  if(at>0){ try{ applyCfg(JSON.parse(d.slice(at))); }catch(e){} }
}
async function pushCfg(){
  await api('/calendars/'+enc(S.calendarId),{method:'PATCH',body:JSON.stringify({description:PREFIX+JSON.stringify(packCfg())})});
}

/* ---------- eventos ---------- */
function eventBody(a,prev,mark){
  const p=(prev&&prev.extendedProperties&&prev.extendedProperties.private)||{};
  const owner=p.dhMember||a.member.id;
  const done = mark ? !!mark.done : (p.dhDone==='1'&&owner===a.member.id);
  const by = done ? (mark?mark.by:(p.dhBy||'')) : '';
  const at = done ? (mark?mark.at:(p.dhAt||'')) : '';
  const start=dateAt(a.date,a.chore.time);
  const end=new Date(start.getTime()+30*60000);
  return {
    summary:(done?'✓ ':'')+a.chore.name+' — '+a.member.name,
    description:'Creado por la app Deberes del Hogar.',
    start:{dateTime:start.toISOString(),timeZone:TZ},
    end:{dateTime:end.toISOString(),timeZone:TZ},
    reminders:{useDefault:false,overrides:[{method:'popup',minutes:30}]},
    extendedProperties:{private:{dhApp:'1',dhKey:a.key,dhChore:a.chore.id,dhMember:a.member.id,
      dhDone:done?'1':'0',dhBy:by,dhAt:at}}
  };
}
async function listEvents(from,to){
  const q=new URLSearchParams({
    privateExtendedProperty:'dhApp=1',
    timeMin:dateAt(from,'00:00').toISOString(),
    timeMax:dateAt(to,'23:59').toISOString(),
    singleEvents:'true', maxResults:'2500'
  });
  const r=await api('/calendars/'+enc(S.calendarId)+'/events?'+q);
  const map={};
  (r.items||[]).forEach(ev=>{
    const k=ev.extendedProperties&&ev.extendedProperties.private&&ev.extendedProperties.private.dhKey;
    if(k) map[k]=ev;
  });
  return map;
}
async function upsert(a,mark){
  const prev=EVMAP[a.key];
  if(!prev&&dateAt(a.date,a.chore.time).getTime()<Date.now()-60000)
    throw new Error('Ese día ya pasó y no está en el calendario.');
  const body=eventBody(a,prev,mark);
  body.iCalUID='dh-'+a.key.replace('|','-')+'@deberes.hogar';
  const json=JSON.stringify(body);
  if(prev&&prev.id){
    EVMAP[a.key]=await api('/calendars/'+enc(S.calendarId)+'/events/'+enc(prev.id),{method:'PATCH',body:json});
  }else{
    try{ EVMAP[a.key]=await api('/calendars/'+enc(S.calendarId)+'/events',{method:'POST',body:json}); }
    catch(e){
      if(e.status!==409) throw e;
      const d=parseISO(a.key.split('|')[0]);
      const map=await listEvents(addDays(d,-1),addDays(d,8));
      const found=map[a.key]; if(!found) throw e;
      EVMAP[a.key]=await api('/calendars/'+enc(S.calendarId)+'/events/'+enc(found.id),{method:'PATCH',body:json});
    }
  }
}
function needsUpdate(a){
  const ev=EVMAP[a.key]; if(!ev) return true;
  const b=eventBody(a,ev), p=(ev.extendedProperties&&ev.extendedProperties.private)||{};
  const t1=new Date(((ev.start||{}).dateTime)||0).getTime();
  const t2=dateAt(a.date,a.chore.time).getTime();
  return ev.summary!==b.summary || t1!==t2 || p.dhMember!==a.member.id || p.dhDone!==b.extendedProperties.private.dhDone;
}
async function pushWeeks(weeks){
  if(!S.calendarId) throw new Error('Primero vincula el calendario (Ajustes).');
  const mon=monday(new Date()), now=Date.now(), limit=iso(mon);
  const want=[], valid=new Set();
  for(let w=0;w<weeks;w++) for(const a of assignments(addDays(mon,w*7))){
    valid.add(a.key);
    if(dateAt(a.date,a.chore.time).getTime()<now-60000) continue;
    want.push(a);
  }
  EVMAP=await listEvents(addDays(mon,-1),addDays(mon,weeks*7+2));
  const jobs=want.filter(needsUpdate);
  await pool(jobs,5,a=>upsert(a));
  const del=Object.keys(EVMAP).filter(k=>k.split('|')[0]>=limit&&!valid.has(k));
  await pool(del,4,async k=>{
    try{ await api('/calendars/'+enc(S.calendarId)+'/events/'+enc(EVMAP[k].id),{method:'DELETE'}); }catch(e){}
    delete EVMAP[k];
  });
  return jobs.length;
}

/* ---------- calendario ---------- */
async function listWritable(){
  const r=await api('/users/me/calendarList?maxResults=250');
  return (r.items||[]).filter(c=>c.accessRole==='owner'||c.accessRole==='writer');
}
async function findCalendar(){
  return (await listWritable()).filter(c=>/deberes del hogar/i.test(c.summary||''))[0]||null;
}
async function createCalendar(){
  const c=await api('/calendars',{method:'POST',body:JSON.stringify({summary:'Deberes del hogar',timeZone:TZ})});
  S.calendarId=c.id; S.calendarName=c.summary||'Deberes del hogar'; save();
  await pushCfg();
  return S.calendarName;
}
async function shareAll(){
  const cal=enc(S.calendarId); let added=0, already=0, failed=0;
  const me=String(S.account||'').toLowerCase();
  for(const m of S.members){
    if(!m.email) continue;
    if(m.email.toLowerCase()===me){ already++; continue; }
    try{
      await api('/calendars/'+cal+'/acl',{method:'POST',body:JSON.stringify({role:'writer',scope:{type:'user',value:m.email}})});
      added++;
    }catch(e){ (e.status===409||e.status===403?already++:failed++); }
  }
  return {added,already,failed};
}
async function syncSunday(){
  if(!S.calendarId) return;
  const sig=(S.sunday.on?'1':'0')+'|'+S.sunday.time;
  if(sig===sundaySig) return;
  const cal=enc(S.calendarId);
  const q=new URLSearchParams({privateExtendedProperty:'dhSunday=1',maxResults:'5'});
  const res=await api('/calendars/'+cal+'/events?'+q);
  const foundAll=((res.items||[]).filter(ev=>ev.extendedProperties&&ev.extendedProperties.private&&ev.extendedProperties.private.dhSunday==='1'));
  if(!S.sunday.on){
    await pool(foundAll,4,ev=>api('/calendars/'+cal+'/events/'+enc(ev.id),{method:'DELETE'}).catch(()=>{}));
    sundaySig=sig; return;
  }
  const found=foundAll[0];
  const [h,m]=String(S.sunday.time||'20:00').split(':').map(Number);
  const d=new Date(); d.setDate(d.getDate()+((7-d.getDay())%7)); d.setHours(h||20,m||0,0,0);
  if(d.getTime()<Date.now()) d.setDate(d.getDate()+7);
  const body={summary:'Elegir los deberes de la semana',
    description:'Cada domingo: revisa quién hace qué en la app Deberes del Hogar.',
    start:{dateTime:d.toISOString(),timeZone:TZ},
    end:{dateTime:new Date(d.getTime()+15*60000).toISOString(),timeZone:TZ},
    recurrence:['RRULE:FREQ=WEEKLY;BYDAY=SU'],
    reminders:{useDefault:false,overrides:[{method:'popup',minutes:0}]},
    extendedProperties:{private:{dhSunday:'1'}}};
  if(found) await api('/calendars/'+cal+'/events/'+enc(found.id),{method:'PATCH',body:JSON.stringify(body)});
  else await api('/calendars/'+cal+'/events',{method:'POST',body:JSON.stringify(body)});
  sundaySig=sig;
}

/* ---------- conexión ---------- */
async function connect(){
  await auth();
  if(!S.account){
    try{ const u=await (await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+tok}})).json();
      if(u&&u.email) S.account=u.email; save(); }catch(e){}
  }
  CONNECTED=true;
  if(!S.calendarId){ const c=await findCalendar(); if(c){ S.calendarId=c.id; S.calendarName=c.summary; save(); } }
  if(S.calendarId) await pullCfg();
}
async function refresh(quiet){
  if(!tok||Date.now()>=tokExp||!S.calendarId) return;
  try{
    if(!dirty&&!saving) await pullCfg();
    const mon=addDays(monday(new Date()),wOff*7);
    EVMAP=await listEvents(addDays(mon,-1),addDays(mon,8));
  }catch(e){ if(!quiet) throw e; }
  render();
}
function touch(){ dirty=true; paintStatus(); clearTimeout(saveTimer); saveTimer=setTimeout(flush,700); }
async function flush(force){
  if(saving||(!dirty&&!force)) return;
  if(!S.calendarId||!tok||Date.now()>=tokExp){ paintStatus(); return; }
  saving=true; paintStatus();
  try{
    await pushCfg();
    await pushWeeks(S.weeks);
    await syncSunday();
    dirty=false;
  }catch(e){ toast('No se pudo guardar: '+e.message,6000); }
  saving=false; paintStatus(); render();
}

/* ---------- UI base ---------- */
function toast(msg,ms=3800){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',ms);}
function paintStatus(){
  const el=document.getElementById('status'); if(!el) return;
  el.className='pill';
  if(saving){ el.textContent='Guardando'; el.classList.add('busy'); return; }
  if(dirty){ el.textContent='Sin guardar'; el.classList.add('busy'); return; }
  if(CONNECTED&&tok){ el.textContent='Conectado'; el.classList.add('on'); return; }
  el.textContent=S.calendarId?'Conectar':'Configurar';
}
async function run(label,fn){
  if(busy) return; busy=true; paintStatus(); toast(label+'…',60000);
  try{ const r=await fn(); toast('Listo'+(r!=null?' · '+r:'')); }
  catch(e){ toast('Error: '+e.message,7000); }
  busy=false; try{ render(); }catch(e){}
}

function wheelSVG(members){
  const n=members.length, seg=360/n, R=118, cx=130, cy=130;
  let out='';
  members.forEach((m,i)=>{
    const a0=(i*seg-90)*Math.PI/180, a1=((i+1)*seg-90)*Math.PI/180;
    const x0=cx+R*Math.cos(a0), y0=cy+R*Math.sin(a0);
    const x1=cx+R*Math.cos(a1), y1=cy+R*Math.sin(a1);
    const large=seg>180?1:0;
    const col=COLORS[i%COLORS.length];
    out+=`<path d="M${cx} ${cy}L${x0.toFixed(1)} ${y0.toFixed(1)}A${R} ${R} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z" fill="${col}" stroke="#0a100e" stroke-width="1.5"/>`;
    const mid=i*seg+seg/2-90;
    const tx=cx+R*0.63*Math.cos(mid*Math.PI/180), ty=cy+R*0.63*Math.sin(mid*Math.PI/180);
    let rot=(mid+90)%360; if(rot<0) rot+=360; if(rot>180) rot-=360;
    if(rot>90||rot<-90) rot+=180;
    out+=`<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" dominant-baseline="central"
      font-family="Plus Jakarta Sans,system-ui" font-size="11" font-weight="800" fill="#fff"
      transform="rotate(${rot.toFixed(1)} ${tx.toFixed(1)} ${ty.toFixed(1)})">${esc(m.name.slice(0,9))}</text>`;
  });
  return `<svg viewBox="0 0 260 260" width="100%" height="100%">${out}</svg>`;
}

/* ---------- acciones ---------- */
function findAssignment(key){
  const a=VIEW.find(x=>x.key===key);
  if(a) return a;
  return assignments(monday(parseISO(key.split('|')[0]))).find(x=>x.key===key)||null;
}
function setLocalDone(key,done,by){
  const ev=EVMAP[key]||{extendedProperties:{private:{}}};
  const p=Object.assign({},ev.extendedProperties&&ev.extendedProperties.private);
  p.dhDone=done?'1':'0'; p.dhBy=done?(by||''):''; p.dhAt=done?new Date().toISOString():'';
  EVMAP[key]=Object.assign({},ev,{extendedProperties:{private:p}});
}

function spinWheel(){
  if(spinning) return;
  const act=activeChores();
  const chore=act.find(c=>c.id===wheelChore)||act[0];
  if(!chore) return toast('Activa un deber primero');
  if(S.members.length<2) return toast('Agrega al menos 2 personas para girar');
  const rnd=new Uint32Array(1); crypto.getRandomValues(rnd);
  const idx=rnd[0]%S.members.length;
  const seg=360/S.members.length;
  const need=(360-(idx*seg+seg/2))%360;
  const cur=((wheelRot%360)+360)%360;
  const target=wheelRot+360*4+((need-cur+360)%360);
  spinning=true; wheelResult=null; render();
  const go=()=>{
    const w=document.getElementById('wheel');
    if(w){ void w.offsetWidth; w.style.transform='rotate('+target+'deg)'; }
  };
  requestAnimationFrame(go);
  setTimeout(go,60);
  setTimeout(()=>{
    spinning=false;
    wheelRot=target;
    const key=iso(monday(new Date()))+'|'+chore.id;
    wheelResult={chore,member:S.members[idx],key};
    render();
  },3700);
}

function onAction(e){
  const el=e.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a, ch=e.type==='change';
  const chore=S.chores.find(c=>c.id===el.dataset.id);

  if(a==='tab'&&!ch){ tab=el.dataset.t; render(); window.scrollTo(0,0); return; }

  if(a==='prev'&&!ch){ wOff--; render(); refresh(true); return; }
  if(a==='next'&&!ch){ wOff++; render(); refresh(true); return; }
  if(a==='done'&&!ch){
    const asg=findAssignment(el.dataset.key); if(!asg) return;
    const nowDone=!!doneOf(asg.key);
    setLocalDone(asg.key,!nowDone,S.account||asg.member.name);
    render();
    (async()=>{
      try{ await auth(); await upsert(asg,doneOf(asg.key)?null:{done:false,by:'',at:''}); }
      catch(err){ setLocalDone(asg.key,nowDone,S.account||''); render(); toast(err.message,5000); }
    })();
    return;
  }
  if(a==='assign'&&!ch){
    const key=el.dataset.key, asg=findAssignment(key); if(!asg) return;
    openSheet('¿Quién lo hace?', S.members.map(m=>({label:m.name,value:m.id,color:colorOf(m),selected:m.id===asg.member.id})), async m=>{
      if(m.id===asg.member.id){ delete S.overrides[key]; } else { S.overrides[key]=m.id; }
      save(); render(); touch();
    });
    return;
  }

  if(a==='toggle'&&ch){ chore.active=el.checked; save(); touch(); return; }
  if(a==='day'&&ch){ chore.day=+el.value; save(); touch(); return; }
  if(a==='time'&&ch){ chore.time=el.value||'18:00'; save(); touch(); return; }
  if(a==='delchore'&&!ch){ if(confirm('¿Quitar «'+chore.name+'»?')){ S.chores=S.chores.filter(c=>c.id!==chore.id); save(); touch(); render(); } return; }
  if(a==='addchore'&&!ch){
    const v=((document.getElementById('newchore')||{}).value||'').trim();
    if(v){ S.chores.push({id:'c'+uid(),name:v,active:true,day:0,time:'18:00'}); save(); touch(); render(); }
    return;
  }

  if(a==='pickwheel'&&!ch){ wheelChore=el.dataset.id; wheelResult=null; render(); return; }
  if(a==='spin'&&!ch){ spinWheel(); return; }
  if(a==='assignwheel'&&!ch){
    if(!wheelResult) return;
    S.overrides[wheelResult.key]=wheelResult.member.id; save();
    const r=wheelResult; wheelResult=null; render(); touch();
    toast(r.member.name+' quedó con '+r.chore.name);
    return;
  }

  if(a==='addmember'&&!ch){
    const n=((document.getElementById('nm')||{}).value||'').trim();
    const m=((document.getElementById('ne')||{}).value||'').trim();
    if(n){ S.members.push({id:'m'+uid(),name:n,email:m}); save(); touch(); render(); }
    return;
  }
  if(a==='delmember'&&!ch){
    if(confirm('¿Quitar a esta persona?')){ S.members=S.members.filter(m=>m.id!==el.dataset.id); save(); touch(); render(); }
    return;
  }

  if(a==='sunday'&&ch){ S.sunday.on=el.checked; save(); touch(); render(); return; }
  if(a==='sundaytime'&&ch){ S.sunday.time=el.value||'20:00'; save(); touch(); return; }
  if(a==='connect'&&!ch){ run('Conectando',async()=>{ tok=null; tokExp=0; await connect(); detectMonthEnd(); return S.calendarName||null; }); return; }
  if(a==='findcal'&&!ch){ run('Buscando',async()=>{ await auth(); const c=await findCalendar();
      if(!c) throw new Error('No encontré el calendario. Pide que te lo compartan o créalo.');
      S.calendarId=c.id; S.calendarName=c.summary; save(); await pullCfg(); return c.summary; }); return; }
  if(a==='pickcal'&&!ch){ run('Leyendo calendarios',async()=>{ await auth(); CALPICK=await listWritable(); return CALPICK.length+' disponibles'; }); return; }
  if(a==='pickgo'&&!ch){
    const sel=document.getElementById('pick'); if(!sel||!sel.value) return;
    S.calendarId=sel.value; S.calendarName=sel.options[sel.selectedIndex].textContent; CALPICK=[]; save();
    run('Vinculando',async()=>{ await pullCfg(); return S.calendarName; }); return;
  }
  if(a==='newcal'&&!ch){ run('Creando',async()=>{ await auth(); const n=await createCalendar(); await syncSunday(); return n; }); return; }
  if(a==='share'&&!ch){ run('Compartiendo',async()=>{ await auth(); const r=await shareAll();
      return `${r.added} nuevos${r.already?', '+r.already+' ya tenían':''}${r.failed?', '+r.failed+' fallaron':''}`; }); return; }
  if(a==='sync'&&!ch){
    S.weeks=Math.min(12,Math.max(1,+(document.getElementById('wk')||{}).value||S.weeks)); save();
    run('Sincronizando',async()=>{ await auth(); await pullCfg(); await pushCfg(); await syncSunday();
      const n=await pushWeeks(S.weeks); dirty=false; return n+' cambios'; });
    return;
  }
  if(a==='openmonth'&&!ch){ openMonth(); return; }
  if(a==='skipmonth'&&!ch){
    if(pendingMonth){ S.skipMonth=monthKey(pendingMonth); save(); }
    pendingMonth=null; render();
    toast('Puedes cerrar el mes desde Ajustes');
    return;
  }
  if(a==='closemonth'&&!ch){ closeMonth(); return; }
  if(a==='sharereport'&&!ch){ shareReport(); return; }
  if(a==='closereport'&&!ch){ REPORT=null; document.getElementById('report').classList.remove('open'); return; }
  if(a==='reset'&&!ch){
    if(confirm('Se borrarán los datos de este teléfono. El calendario de Google no se toca.')){
      localStorage.removeItem(KEY); S=load(); tok=null; tokExp=0; CONNECTED=false; EVMAP={}; dirty=false;
      pendingMonth=null; REPORT=null; document.getElementById('report').classList.remove('open'); render();
    }
    return;
  }
}

/* ---------- cierre de mes ---------- */
function detectMonthEnd(){
  const now=new Date();
  let y=now.getFullYear(), m=now.getMonth();
  if(lastSundayOf(y,m).getTime()<now.getTime()){
    // el último domingo ya pasó: toca cerrar el mes en curso
  }else{
    m--; if(m<0){ m=11; y--; }
  }
  const key=y+'-'+String(m+1).padStart(2,'0');
  if(S.archive.some(a=>a[0]===key)||S.skipMonth===key){ pendingMonth=null; return null; }
  if(S.since&&iso(lastSundayOf(y,m))<S.since){ pendingMonth=null; return null; }
  pendingMonth={y,m,key,from:new Date(y,m,1),to:new Date(y,m+1,0),label:MONTHS[m]+' '+y};
  return pendingMonth;
}
function monthKey(p){
  if(typeof p.y==='number'&&typeof p.m==='number') return p.y+'-'+String(p.m+1).padStart(2,'0');
  const d=p.from||new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

async function openMonth(){
  if(!S.calendarId){ toast('Primero vincula el calendario en Ajustes'); return; }
  try{ await auth(); }catch(e){ toast(e.message,6000); return; }
  try{ await pullCfg(); }catch(e){}
  let p=pendingMonth;
  if(!p){
    const now=new Date();
    let y=now.getFullYear(), m=now.getMonth()-1;
    if(m<0){ m=11; y--; }
    p={y,m,from:new Date(y,m,1),to:new Date(y,m+1,0),label:MONTHS[m]+' '+y};
  }
  let map={};
  try{ map=await listEvents(p.from,p.to); }catch(e){ toast('Error: '+e.message,6000); return; }
  const evs=Object.values(map);
  if(!evs.length){
    S.skipMonth=monthKey(p); save();
    if(pendingMonth) pendingMonth=null;
    toast('No hay deberes registrados en '+p.label);
    render();
    return;
  }
  const rows=groupStats(evs);
  REPORT={p,rows,map};
  renderReport();
}

function groupStats(evs){
  const per=new Map();
  evs.forEach(ev=>{
    const pr=(ev.extendedProperties&&ev.extendedProperties.private)||{};
    const mem=S.members.find(m=>m.id===pr.dhMember)||{id:pr.dhMember,name:pr.dhMember||'Alguien',email:''};
    const day=(ev.start&&ev.start.dateTime)?new Date(ev.start.dateTime):null;
    const title=String(ev.summary||'').replace(/^[✓🏠✅]\s*/,'').split(' — ')[0];
    const rec=per.get(mem.id)||{id:mem.id,name:mem.name,color:colorOf(mem),done:[],missed:[],byOther:[]};
    if(pr.dhDone==='1'){
      rec.done.push({title,day});
      if(pr.dhBy&&pr.dhBy!==mem.email&&pr.dhBy!==mem.name) rec.byOther.push({title,by:pr.dhBy});
    }else rec.missed.push({title,day});
    per.set(mem.id,rec);
  });
  return [...per.values()].sort((a,b)=>(b.done.length-b.missed.length)-(a.done.length-a.missed.length));
}

/* tarjeta PNG por persona */
function drawHeart(c,x,y,cell){
  const G=[
    "..KKK.KKK..",".KRRRKRRRK.","KRRRRRRWRRK","KRRRRRRRWRK","KRRRRRRRRRK",
    ".KRRRRRRRK.","..KRRRRRK..","...KRRRK...","....KRK....",".....K....."];
  const col={K:'#000000',R:'#fc1818',W:'#ffffff'};
  G.forEach((row,ry)=>{ [...row].forEach((ch,rx)=>{ if(!col[ch]) return;
    c.fillStyle=col[ch]; c.fillRect(x+rx*cell,y+ry*cell,cell,cell); }); });
}

async function cardURL(rec,p){
  try{ await document.fonts.ready; }catch(e){}
  const doneN=rec.done.length, missN=rec.missed.length, byN=rec.byOther.length;
  const shownD=Math.min(9,doneN), shownM=Math.min(5,missN), shownB=Math.min(3,byN);
  let need=545;
  if(doneN) need+=42+shownD*43+(doneN>shownD?44:0)+20;
  if(missN) need+=42+shownM*43+(missN>shownM?44:0)+20;
  if(byN)   need+=42+shownB*40+(byN>shownB?40:0)+20;
  need+=90;
  const W=1080,H=Math.max(1350,need), cv=document.createElement('canvas');
  cv.width=W; cv.height=H;
  const c=cv.getContext('2d');
  const g=c.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#0b1210'); g.addColorStop(.55,'#0e1a16'); g.addColorStop(1,'#12302a');
  c.fillStyle=g; c.fillRect(0,0,W,H);
  c.fillStyle=rec.color; c.globalAlpha=.14; c.beginPath(); c.arc(W-90,120,320,0,7); c.fill(); c.globalAlpha=1;

  drawHeart(c,80,70,6.2);
  c.fillStyle='#ffffff'; c.font='800 34px "Plus Jakarta Sans",sans-serif';
  c.fillText('Deberes del Hogar',230,105);
  c.fillStyle='#8ea29a'; c.font='600 26px "Plus Jakarta Sans",sans-serif';
  c.fillText('Resumen de '+p.label,230,145);

  const total=doneN+missN;
  const pct=total?Math.round(doneN/total*100):0;

  c.fillStyle=rec.color; c.beginPath(); c.arc(140,330,78,0,7); c.fill();
  c.fillStyle='#fff'; c.font='800 54px "Plus Jakarta Sans",sans-serif';
  c.textAlign='center'; c.fillText(initials(rec.name),140,350); c.textAlign='left';

  c.fillStyle='#ffffff'; c.font='800 62px "Plus Jakarta Sans",sans-serif';
  c.fillText(String(rec.name).slice(0,22),260,330);
  c.fillStyle='#a7bab2'; c.font='600 30px "Plus Jakarta Sans",sans-serif';
  c.fillText(doneN+' de '+total+' deberes completados',260,378);

  c.fillStyle='rgba(255,255,255,.12)'; c.beginPath(); c.roundRect(80,450,920,22,11); c.fill();
  c.fillStyle=rec.color; c.beginPath(); c.roundRect(80,450,Math.max(22,920*pct/100),22,11); c.fill();
  c.fillStyle='#ffffff'; c.font='800 30px "Plus Jakarta Sans",sans-serif';
  c.textAlign='right'; c.fillText(pct+'%',1000,428); c.textAlign='left';

  let y=545;
  const head=(txt,color)=>{
    c.fillStyle=color; c.font='800 24px "Plus Jakarta Sans",sans-serif';
    c.fillText(txt,80,y); y+=42;
  };
  const row=(txt,color,mark)=>{
    c.fillStyle=color; c.font='800 30px "Plus Jakarta Sans",sans-serif';
    c.fillText(mark,80,y);
    c.fillStyle='#e9f0ec'; c.font='600 28px "Plus Jakarta Sans",sans-serif';
    c.fillText(txt.slice(0,30),130,y);
    y+=43;
  };
  const more=(n)=>{ c.fillStyle='#8ea29a'; c.font='600 26px "Plus Jakarta Sans",sans-serif';
    c.fillText('+'+n+' más',130,y); y+=44; };

  if(doneN){
    head('LO QUE COMPLETASTE','#3ecf8e');
    rec.done.slice(0,shownD).forEach(d=>row(d.title,'#3ecf8e','✓'));
    if(doneN>shownD) more(doneN-shownD);
    y+=20;
  }
  if(missN){
    head('TE FALTARON','#ff9f8f');
    rec.missed.slice(0,shownM).forEach(d=>row(d.title,'#ff9f8f','○'));
    if(missN>shownM) more(missN-shownM);
    y+=20;
  }
  if(byN){
    head('TE LO HIZO OTRA PERSONA','#ffffff');
    rec.byOther.slice(0,shownB).forEach(b=>{
      c.fillStyle='#e9f0ec'; c.font='600 27px "Plus Jakarta Sans",sans-serif';
      c.fillText((b.title.slice(0,24)+' — '+String(b.by).split('@')[0]).slice(0,46),80,y); y+=40;
    });
    if(byN>shownB){ c.fillStyle='#8ea29a'; c.font='600 25px "Plus Jakarta Sans",sans-serif';
      c.fillText('+'+(byN-shownB)+' más',80,y); y+=40; }
  }
  c.fillStyle='rgba(255,255,255,.35)'; c.font='600 24px "Plus Jakarta Sans",sans-serif';
  c.fillText('Generado por la app Deberes del Hogar',80,H-70);
  return cv.toDataURL('image/png');
}

async function shareReport(){

  const files=[];
  try{
    const src=REPORT.imgs&&REPORT.imgs.length?REPORT.imgs:REPORT.rows.map(r=>({r,url:null}));
    for(const x of src){
      const url=x.url||await cardURL(x.r,REPORT.p);
      const blob=await (await fetch(url)).blob();
      files.push(new File([blob],'deberes-'+x.r.name.replace(/\s+/g,'-').toLowerCase()+'.png',{type:'image/png'}));
    }
    if(navigator.canShare&&navigator.canShare({files})){
      await navigator.share({files,title:'Deberes de '+REPORT.p.label});
    }else{
      downloadFiles(files);
      toast('Imágenes descargadas');
    }
  }catch(e){
    if(!/cancel/i.test(String((e&&e.message)||e))){
      if(files.length){ downloadFiles(files); toast('No se pudo compartir; imágenes descargadas',6000); }
      else toast('No se pudo compartir: '+((e&&e.message)||e),6000);
    }
  }
}

async function closeMonth(){
  if(!REPORT) return;
  if(!confirm('Se borrarán del calendario los deberes de '+REPORT.p.label+'. El resumen ya quedó guardado. ¿Seguir?')) return;
  const ids=Object.values(REPORT.map).map(ev=>ev.id).filter(Boolean);
  let ok=0, fail=0;
  await pool(ids,4,async id=>{
    try{ await api('/calendars/'+enc(S.calendarId)+'/events/'+enc(id),{method:'DELETE'}); ok++; }
    catch(e){ fail++; }
  });
  const key=monthKey(REPORT.p);
  S.archive=S.archive.filter(a=>a[0]!==key);
  S.archive.push([key,REPORT.rows.map(r=>[r.name,r.done.length,r.missed.length,r.byOther.length])]);
  save();
  try{ await pushCfg(); }catch(e){}
  REPORT=null; pendingMonth=null; EVMAP={};
  document.getElementById('report').classList.remove('open');
  toast('Mes cerrado · '+ok+' deberes borrados'+(fail?', '+fail+' no se pudieron borrar':''),fail?7000:4500);
  render();
  refresh(true);
}

/* ---------- arranque ---------- */
render();
detectMonthEnd();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) return;
  const before=pendingMonth&&pendingMonth.key;
  detectMonthEnd();
  if((pendingMonth&&pendingMonth.key)!==before) render();
  refresh(true);
  if(dirty) flush(true);
});
window.addEventListener('online',()=>{ if(dirty) flush(true); });
</script>
